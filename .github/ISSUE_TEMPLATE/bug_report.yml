name: Bug report
description: Something doesn't work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for the report. Please leave out anything private, such as certificate or key files.
  - type: input
    id: version
    attributes:
      label: kobracontrol version
      description: Settings page of the Kobra Control tab.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: orca
    attributes:
      label: OrcaSlicer version and OS
      placeholder: "OrcaSlicer 2.5.0, macOS 15"
    validations:
      required: true
  - type: input
    id: firmware_version
    attributes:
      label: Printer and firmware version
      description: From the printer's touchscreen.
      placeholder: "Kobra X, 2.0.x"
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Print or Send from OrcaSlicer
        - Device tab
        - Dashboard / camera
        - ACE slots / drying
        - Spoolman
        - Files
        - Certificate setup / connection
        - Spooler integration
        - Settings
        - Other
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Steps, what you expected, what you got.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Plugin log
      description: Relevant lines from <OrcaSlicer data folder>/log/python_*.log
      render: text
